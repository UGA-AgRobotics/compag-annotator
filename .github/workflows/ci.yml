name: Installed release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and test tools
        run: python -m pip install '.[test,dev]'
      - name: Lint executable Python
        run: python -m ruff check src tests scripts
      - name: JavaScript unit tests
        run: node --experimental-default-type=module --test tests/js/*.test.js
      - name: Resolve versioned artifacts
        id: release
        run: |
          echo "wheel=$(python scripts/release_paths.py --field wheel)" >> "$GITHUB_OUTPUT"
          echo "sdist=$(python scripts/release_paths.py --field sdist)" >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Scan source, history and actual build contents
        run: >-
          python scripts/stage_public.py --source . --history
          --artifact "${{ steps.release.outputs.wheel }}"
          --artifact "${{ steps.release.outputs.sdist }}" --require-artifacts
          --report "$RUNNER_TEMP/sanitization.json"
      - name: Install built wheel in separate environment
        run: |
          python -m venv "$RUNNER_TEMP/compag-installed"
          "$RUNNER_TEMP/compag-installed/bin/python" -m pip install "${{ steps.release.outputs.wheel }}[test]"
          "$RUNNER_TEMP/compag-installed/bin/python" -m playwright install --with-deps chromium
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compag-installed/bin/compag-annotator" --version
          "$RUNNER_TEMP/compag-installed/bin/compag-annotator" doctor --json
          "$RUNNER_TEMP/compag-installed/bin/python" -I -c "import compag_annotator.app,sys; from importlib.resources import files; p=files('compag_annotator'); assert p.joinpath('help/index.html').is_file(); assert p.joinpath('web/assets/index.html').is_file(); assert 'torch' not in sys.modules"
      - name: Core and browser tests against installed wheel
        env:
          COMPAG_TEST_INSTALLED_PYTHON: ${{ runner.temp }}/compag-installed/bin/python
          CUDA_VISIBLE_DEVICES: '-1'
        run: |
          cd "$RUNNER_TEMP"
          "$COMPAG_TEST_INSTALLED_PYTHON" -m pytest -q "$GITHUB_WORKSPACE/tests" --ignore="$GITHUB_WORKSPACE/tests/browser" -o pythonpath= --junitxml=core.xml
          "$COMPAG_TEST_INSTALLED_PYTHON" -m pytest -q "$GITHUB_WORKSPACE/tests/browser" -o pythonpath= --junitxml=browser.xml
